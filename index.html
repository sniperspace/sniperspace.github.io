<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="OUTMATH — Coming Soon | Real-World 3D Cinematic Teaser" />
  <title>OUTMATH — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --bg-space: #03050a;
      --glass: rgba(10, 14, 24, 0.56);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-dim: rgba(248, 250, 252, 0.72);
      --accent-blue: #8ab4f8;
      --accent-green: #81c995;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(1.5px 1.5px at 15% 22%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 78% 18%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 42% 82%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 88% 74%, rgba(255,255,255,0.5), transparent),
        radial-gradient(circle at 50% 45%, #0c1428 0%, var(--bg-space) 75%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Real-World 3D Map */
    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Subtle attribution styling */
    .maplibregl-ctrl-attrib {
      background: rgba(5, 8, 16, 0.55) !important;
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 10px !important;
      border-radius: 8px 0 0 0;
    }
    .maplibregl-ctrl-attrib a {
      color: rgba(255, 255, 255, 0.65) !important;
    }

    /* Cinematic Vignette & Color Grade */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(6, 9, 16, 0.05) 35%, rgba(5, 8, 14, 0.72) 100%),
        linear-gradient(180deg, rgba(5, 8, 14, 0.58) 0%, transparent 22%, transparent 74%, rgba(5, 8, 14, 0.82) 100%);
    }

    /* Clean Google-Style Floating HUD */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 32px);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .top-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .glass-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-main);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .glass-btn:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .glass-btn.active {
      background: rgba(138, 180, 248, 0.22);
      border-color: var(--accent-blue);
    }

    /* Center Hero Title */
    .hero-center {
      margin: auto;
      text-align: center;
      max-width: 760px;
      padding: 0 14px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.explore-mode .hero-center {
      opacity: 0;
      transform: translateY(-16px);
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 1.4vw, 0.84rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent-blue);
      margin-bottom: 14px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.2rem, 11vw, 7.2rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      padding-left: 0.14em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 12px 42px rgba(0, 0, 0, 0.7);
      margin-bottom: 18px;
    }

    .divider-row {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .hairline {
      width: clamp(28px, 6vw, 64px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65));
    }
    .hairline.right {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.65), transparent);
    }

    .coming-soon {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      text-transform: uppercase;
    }

    .tagline {
      font-size: clamp(0.9rem, 1.8vw, 1.06rem);
      font-weight: 300;
      color: var(--text-dim);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    /* Bottom Telemetry & Location Switcher */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .telemetry {
      padding: 12px 18px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      min-width: 245px;
    }

    .loc-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.96rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .loc-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .waypoints {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
      padding: 6px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .wp-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .wp-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .wp-btn.active {
      background: #ffffff;
      color: #060910;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .hud-bottom {
        flex-direction: column;
        align-items: stretch;
      }
      .waypoints {
        border-radius: 16px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="cinema-vignette"></div>

  <div class="hud">
    <header class="hud-top">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="mode-label">LIVE 3D EARTH // AUTOPILOT</span>
      </div>

      <div class="top-actions">
        <button class="glass-btn active" id="autopilot-btn">Autopilot: ON</button>
        <button class="glass-btn" id="explore-btn">Free Explore</button>
      </div>
    </header>

    <main class="hero-center">
      <div class="eyebrow" id="eyebrow-el">TETHERIS.APP // REAL-WORLD 3D</div>
      <h1 class="hero-title" id="title-el">OUTMATH</h1>
      <div class="divider-row">
        <span class="hairline"></span>
        <span class="coming-soon">COMING SOON</span>
        <span class="hairline right"></span>
      </div>
      <p class="tagline" id="tagline-el">
        Precision strategy, live computation, and a new world to master. Launching soon.
      </p>
    </main>

    <footer class="hud-bottom">
      <div class="telemetry">
        <div class="loc-title" id="loc-title">Orbital Approach — Earth</div>
        <div class="loc-meta">
          <span id="meta-coords">35.3606° N, 138.7274° E</span>
          <span id="meta-zoom">ZOOM 2.2</span>
          <span id="meta-hdg">HDG 000°</span>
        </div>
      </div>

      <nav class="waypoints" id="waypoint-nav" aria-label="Locations"></nav>
    </footer>
  </div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

    /* =========================================================================
       ✨ CUSTOMIZE YOUR TEASER TEXT & REAL-WORLD FLYTHROUGH LOCATIONS HERE
       ========================================================================= */
    const TEASER_CONFIG = {
      eyebrow: "TETHERIS.APP // REAL-WORLD 3D",
      title: "OUTMATH",
      tagline: "Precision strategy, live computation, and a new world to master. Launching soon."
    };

    const SCENES = [
      {
        label: "Mt. Fuji",
        title: "Mount Fuji — Honshu, Japan",
        center: [138.7274, 35.3606],
        zoom: 12.6,
        pitch: 74,
        bearing: 135,
        orbitSeconds: 16
      },
      {
        label: "Tokyo",
        title: "Minato & Tokyo Tower — Japan",
        center: [139.7454, 35.6586],
        zoom: 15.8,
        pitch: 66,
        bearing: -35,
        orbitSeconds: 16
      },
      {
        label: "Swiss Alps",
        title: "Matterhorn Peak — Zermatt, Switzerland",
        center: [7.6586, 45.9766],
        zoom: 13.1,
        pitch: 75,
        bearing: 45,
        orbitSeconds: 16
      },
      {
        label: "Manhattan",
        title: "Midtown Skyline — New York, USA",
        center: [-73.9855, 40.7484],
        zoom: 15.7,
        pitch: 68,
        bearing: 25,
        orbitSeconds: 16
      },
      {
        label: "Grand Canyon",
        title: "Grand Canyon National Park — Arizona, USA",
        center: [-112.1129, 36.1069],
        zoom: 13.0,
        pitch: 73,
        bearing: -110,
        orbitSeconds: 16
      }
    ];

    document.getElementById("eyebrow-el").textContent = TEASER_CONFIG.eyebrow;
    document.getElementById("title-el").textContent = TEASER_CONFIG.title;
    document.getElementById("tagline-el").textContent = TEASER_CONFIG.tagline;

    /* =========================================================================
       1. INITIALIZE 100% FREE REAL-WORLD 3D GLOBE + TERRAIN + 3D BUILDINGS
       ========================================================================= */
    const map = new maplibregl.Map({
      container: "map",
      center: [138.7274, 35.3606],
      zoom: 2.1,
      pitch: 18,
      bearing: 0,
      maxPitch: 82,
      attributionControl: { compact: true },
      style: {
        version: 8,
        projection: { type: "globe" },
        sources: {
          satellite: {
            type: "raster",
            tiles: [
              "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
            ],
            tileSize: 256,
            maxzoom: 18,
            attribution: "Imagery © Esri"
          },
          terrainSource: {
            type: "raster-dem",
            tiles: [
              "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
            ],
            encoding: "terrarium",
            tileSize: 256,
            maxzoom: 14,
            attribution: "3D Terrain © AWS Open Data"
          },
          openfreemap: {
            type: "vector",
            url: "https://tiles.openfreemap.org/planet"
          }
        },
        layers: [
          {
            id: "satellite-layer",
            type: "raster",
            source: "satellite",
            paint: {
              "raster-contrast": 0.06,
              "raster-saturation": 0.08
            }
          },
          {
            id: "3d-buildings",
            source: "openfreemap",
            "source-layer": "building",
            type: "fill-extrusion",
            minzoom: 13.5,
            filter: ["!=", ["get", "hide_3d"], true],
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["coalesce", ["get", "render_height"], 0],
                0, "#cbd5e1",
                90, "#94a3b8",
                220, "#60a5fa",
                420, "#e0f2fe"
              ],
              "fill-extrusion-height": [
                "interpolate",
                ["linear"],
                ["zoom"],
                13.5, 0,
                14.5, ["coalesce", ["get", "render_height"], 0]
              ],
              "fill-extrusion-base": [
                "interpolate",
                ["linear"],
                ["zoom"],
                13.5, 0,
                14.5, ["coalesce", ["get", "render_min_height"], 0]
              ],
              "fill-extrusion-opacity": 0.78
            }
          }
        ],
        terrain: {
          source: "terrainSource",
          exaggeration: 1.45
        },
        sky: {
          "sky-color": "#0b1a3d",
          "sky-horizon-blend": 0.55,
          "horizon-color": "#a8c7fa",
          "horizon-fog-blend": 0.75,
          "fog-color": "#6482ad",
          "fog-ground-blend": 0.65,
          "atmosphere-blend": [
            "interpolate",
            ["linear"],
            ["zoom"],
            0, 1,
            5, 1,
            9, 0.2,
            12, 0
          ]
        }
      }
    });

    /* =========================================================================
       2. BUILD WAYPOINT BUTTONS & LIVE TELEMETRY
       ========================================================================= */
    const wpNav = document.getElementById("waypoint-nav");
    SCENES.forEach((scene, idx) => {
      const btn = document.createElement("button");
      btn.className = "wp-btn" + (idx === 0 ? " active" : "");
      btn.textContent = scene.label;
      btn.addEventListener("click", () => jumpToScene(idx));
      wpNav.appendChild(btn);
    });

    function setActiveWaypoint(idx) {
      document.querySelectorAll(".wp-btn").forEach((b, i) => {
        b.classList.toggle("active", i === idx);
      });
      document.getElementById("loc-title").textContent = SCENES[idx].title;
    }

    function updateTelemetry() {
      const c = map.getCenter();
      const latStr = `${Math.abs(c.lat).toFixed(4)}° ${c.lat >= 0 ? "N" : "S"}`;
      const lngStr = `${Math.abs(c.lng).toFixed(4)}° ${c.lng >= 0 ? "E" : "W"}`;
      document.getElementById("meta-coords").textContent = `${latStr}, ${lngStr}`;
      document.getElementById("meta-zoom").textContent = `ZOOM ${map.getZoom().toFixed(1)}`;
      const hdg = ((Math.round(map.getBearing()) % 360) + 360) % 360;
      document.getElementById("meta-hdg").textContent = `HDG ${String(hdg).padStart(3, "0")}°`;
    }

    map.on("move", updateTelemetry);

    /* =========================================================================
       3. ENDLESS CINEMATIC AUTOPILOT LOOP (FLY -> ORBIT -> NEXT LOCATION)
       ========================================================================= */
    let currentIdx = 0;
    let autopilot = true;
    let orbitRaf = null;
    let tourId = 0;

    function stopOrbit() {
      if (orbitRaf) {
        cancelAnimationFrame(orbitRaf);
        orbitRaf = null;
      }
    }

    function updateAutopilotUI() {
      const btn = document.getElementById("autopilot-btn");
      const label = document.getElementById("mode-label");
      btn.textContent = autopilot ? "Autopilot: ON" : "Autopilot: PAUSED";
      btn.classList.toggle("active", autopilot);
      label.textContent = autopilot
        ? "LIVE 3D EARTH // AUTOPILOT"
        : "MANUAL CAMERA // DRAG TO EXPLORE";
    }

    function flyToScene(idx, activeTourId) {
      if (!autopilot || activeTourId !== tourId) return;
      stopOrbit();
      currentIdx = idx;
      const s = SCENES[idx];
      setActiveWaypoint(idx);

      map.flyTo({
        center: s.center,
        zoom: s.zoom,
        pitch: s.pitch,
        bearing: s.bearing,
        speed: 0.42,
        curve: 1.55,
        essential: true
      });

      map.once("moveend", () => {
        if (!autopilot || activeTourId !== tourId) return;
        startCinematicOrbit(s.orbitSeconds, activeTourId);
      });
    }

    function startCinematicOrbit(seconds, activeTourId) {
      const startTime = performance.now();
      let lastFrame = startTime;

      function step(now) {
        if (!autopilot || activeTourId !== tourId) return;
        const dt = (now - lastFrame) / 1000;
        lastFrame = now;

        // Smooth 7.5 degrees/sec drone-style orbit around landmark
        map.setBearing(map.getBearing() + dt * 7.5);

        if ((now - startTime) / 1000 >= seconds) {
          const nextIdx = (currentIdx + 1) % SCENES.length;
          flyToScene(nextIdx, activeTourId);
          return;
        }
        orbitRaf = requestAnimationFrame(step);
      }

      orbitRaf = requestAnimationFrame(step);
    }

    function jumpToScene(idx) {
      tourId++;
      autopilot = true;
      updateAutopilotUI();
      stopOrbit();
      map.stop();
      flyToScene(idx, tourId);
    }

    function pauseAutopilot() {
      if (!autopilot) return;
      autopilot = false;
      tourId++;
      stopOrbit();
      map.stop();
      updateAutopilotUI();
    }

    // Pause autopilot automatically when visitor grabs or zooms the 3D globe
    map.on("dragstart", pauseAutopilot);
    map.on("wheel", pauseAutopilot);

    document.getElementById("autopilot-btn").addEventListener("click", () => {
      if (autopilot) {
        pauseAutopilot();
      } else {
        jumpToScene(currentIdx);
      }
    });

    document.getElementById("explore-btn").addEventListener("click", (e) => {
      const hidden = document.body.classList.toggle("explore-mode");
      e.target.textContent = hidden ? "Show Title" : "Free Explore";
      e.target.classList.toggle("active", hidden);
    });

    // Launch dive from space once map loads
    map.on("load", () => {
      updateTelemetry();
      setTimeout(() => {
        flyToScene(0, ++tourId);
      }, 1100);
    });
  </script>
</body>
</html>
