<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1024" />
  <meta name="description" content="OUTMATH — Coming Soon | By Tetheris App Studios" />
  <title>OUTMATH — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text-main: #fdfbff;
      --text-soft: rgba(250, 246, 255, 0.78);
      --glass-bg: rgba(14, 15, 32, 0.36);
      --glass-border: rgba(255, 255, 255, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0e21;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #suzume-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* Subtle Anamorphic Anime Film Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 42%, rgba(8, 7, 22, 0.52) 100%),
        linear-gradient(180deg, rgba(10, 10, 28, 0.32) 0%, transparent 18%, transparent 80%, rgba(8, 8, 22, 0.62) 100%);
    }

    /* Minimalist Floating HUD */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 34px);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .realm-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: opacity 0.45s ease;
    }

    .realm-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffd3a5;
      box-shadow: 0 0 12px #ffd3a5;
      animation: starPulse 2.4s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .glass-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.73rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-main);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .glass-btn.active {
      background: rgba(255, 255, 255, 0.92);
      color: #101226;
      border-color: #ffffff;
    }

    /* Center Hero Lockup */
    .hero-center {
      margin: auto;
      text-align: center;
      max-width: 780px;
      padding: 0 16px;
      transform: translateY(-6vh);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    body.zen-mode .hero-center,
    body.zen-mode .realm-pill,
    body.zen-mode .hud-hint {
      opacity: 0;
      transform: translateY(-8vh);
    }

    .jp-kicker {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(0.82rem, 1.8vw, 1.05rem);
      font-weight: 400;
      letter-spacing: 0.52em;
      padding-left: 0.52em;
      color: rgba(255, 240, 245, 0.94);
      text-shadow: 0 2px 18px rgba(15, 10, 38, 0.75);
      margin-bottom: 12px;
    }

    .game-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 10vw, 6.8rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1.02;
      color: #ffffff;
      text-shadow:
        0 6px 34px rgba(18, 12, 46, 0.65),
        0 0 22px rgba(255, 215, 235, 0.35);
      margin-bottom: 16px;
    }

    .coming-row {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .hairline {
      width: clamp(28px, 6vw, 72px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85));
    }
    .hairline.right {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.85), transparent);
    }

    .coming-text {
      font-size: clamp(0.8rem, 1.8vw, 1.02rem);
      font-weight: 500;
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(15, 10, 35, 0.85);
    }

    .tagline {
      font-size: clamp(0.86rem, 1.6vw, 1rem);
      font-weight: 300;
      color: var(--text-soft);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.65;
      text-shadow: 0 2px 16px rgba(12, 10, 32, 0.9);
    }

    /* Bottom Footer with Studio Credit */
    .hud-bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 12px;
    }

    .hud-hint {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
      transition: opacity 0.45s ease;
    }

    .studio-credit {
      text-align: center;
      font-size: clamp(0.75rem, 1.4vw, 0.86rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      padding-left: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 250, 255, 0.95);
      text-shadow: 0 2px 16px rgba(10, 8, 28, 0.95);
    }

    .progress-wrap {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }

    .door-progress-bar {
      width: 76px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }

    .door-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a7d8ff, #ffd1dc);
      border-radius: 99px;
    }

    @media (max-width: 820px) {
      .hud-bottom {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        gap: 8px;
      }
      .progress-wrap {
        justify-self: center;
        order: 1;
      }
      .studio-credit {
        order: 2;
      }
      .hud-hint {
        order: 3;
      }
      .hud-top {
        justify-content: center;
      }
      .hero-center {
        transform: translateY(-4vh);
      }
    }
  </style>
</head>
<body>

  <canvas id="suzume-canvas"></canvas>
  <div class="cinema-vignette"></div>

  <div class="hud">
    <header class="hud-top">
      <div class="realm-pill">
        <span class="realm-dot" id="realm-dot"></span>
        <span id="realm-name">EVER-AFTER TWILIGHT // 常世</span>
      </div>

      <div class="top-actions">
        <button class="glass-btn" id="next-door-btn">Next Door ➔</button>
        <button class="glass-btn" id="audio-btn">Sound: Off</button>
        <button class="glass-btn" id="zen-btn">Hide Title</button>
      </div>
    </header>

    <main class="hero-center">
      <div class="jp-kicker" id="jp-kicker">扉の向こう側へ</div>
      <h1 class="game-title" id="game-title">OUTMATH</h1>
      <div class="coming-row">
        <span class="hairline"></span>
        <span class="coming-text" id="coming-text">COMING SOON</span>
        <span class="hairline right"></span>
      </div>
      <p class="tagline" id="tagline-text">
        Beyond every open door lies a new equation waiting to be solved.
      </p>
    </main>

    <footer class="hud-bottom
