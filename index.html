<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#140f0c" />
  <meta name="description" content="OUTMATH — Coming Soon | By Tetheris App Studios" />
  <title>OUTMATH — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text-primary: #faf6f0;
      --text-muted: rgba(250, 246, 240, 0.76);
      --glass-bg: rgba(16, 12, 10, 0.48);
      --glass-border: rgba(255, 244, 230, 0.2);
      --vermilion: #e04622;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140d09;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #scene-container:active {
      cursor: grabbing;
    }

    /* Subtle 35mm Cinema Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, transparent 38%, rgba(10, 7, 5, 0.65) 100%),
        linear-gradient(180deg, rgba(10, 7, 6, 0.42) 0%, transparent 20%, transparent 76%, rgba(10, 7, 6, 0.78) 100%);
    }

    /* Minimalist Cinema HUD Overlay */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 34px);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-primary);
      transition: opacity 0.4s ease;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--vermilion);
      box-shadow: 0 0 10px rgba(224, 70, 34, 0.95);
    }

    .top-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .pill-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 245, 235, 0.18);
      border-color: rgba(255, 245, 235, 0.45);
    }

    .pill-btn.active {
      background: rgba(250, 246, 240, 0.94);
      color: #140f0c;
      border-color: #faf6f0;
    }

    /* Center Hero Title Lockup */
    .hero-center {
      margin: auto;
      text-align: center;
      max-width: 780px;
      padding: 0 16px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.zen-mode .hero-center,
    body.zen-mode .location-badge,
    body.zen-mode .hud-bottom-meta {
      opacity: 0;
      transform: translateY(-10px);
    }

    .jp-kicker {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(0.85rem, 1.9vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.55em;
      padding-left: 0.55em;
      color: rgba(255, 234, 214, 0.95);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.85);
      margin-bottom: 14px;
    }

    .game-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.1rem, 10.5vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1.02;
      color: #ffffff;
      text-shadow:
        0 10px 40px rgba(0, 0, 0, 0.8),
        0 2px 12px rgba(0, 0, 0, 0.65);
      margin-bottom: 18px;
    }

    .coming-row {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .line-sep {
      width: clamp(28px, 6vw, 72px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 240, 225, 0.78));
    }
    .line-sep.right {
      background: linear-gradient(90deg, rgba(255, 240, 225, 0.78), transparent);
    }

    .coming-text {
      font-size: clamp(0.82rem, 1.8vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      text-transform: uppercase;
      color: #fff6ee;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    .tagline {
      font-size: clamp(0.88rem, 1.7vw, 1.02rem);
      font-weight: 300;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.65;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.95);
    }

    /* Bottom Bar with Studio Credit & Atmosphere Controls */
    .hud-bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 14px;
    }

    .hud-bottom-meta {
      font-size: 0.7rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(250, 246, 240, 0.66);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
      transition: opacity 0.4s ease;
    }

    .studio-credit {
      text-align: center;
      font-size: clamp(0.74rem, 1.4vw, 0.84rem);
      font-weight: 500;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 244, 232, 0.92);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      padding-bottom: 6px;
    }

    .mood-bar {
      justify-self: end;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .mood-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mood-btn:hover {
      color: #ffffff;
    }

    .mood-btn.active {
      background: #faf6f0;
      color: #140f0c;
    }

    @media (max-width: 900px) {
      .hud-bottom {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        gap: 10px;
      }
      .mood-bar {
        justify-self: center;
      }
      .hud-top {
        justify-content: center;
      }
      .hud-bottom-meta {
        order: 3;
      }
      .studio-credit {
        order: 2;
        padding-bottom: 0;
      }
      .mood-bar {
        order: 1;
      }
    }
  </style>
</head>
<body>

  <div id="scene-container"></div>
  <div class="cinema-vignette"></div>

  <div class="hud">
    <header class="hud-top">
      <div class="location-badge">
        <span class="badge-dot"></span>
        <span id="loc-badge-text">KYOTO // SENBON TORII PATH</span>
      </div>

      <div class="top-controls">
        <button class="pill-btn" id="pause-btn">Pause Walk</button>
        <button class="pill-btn" id="audio-btn">Sound: Off</button>
        <button class="pill-btn" id="zen-btn">Hide Title</button>
      </div>
    </header>

    <main class="hero-center">
      <div class="jp-kicker" id="jp-kicker">京都・千本鳥居</div>
      <h1 class="game-title" id="game-title">OUTMATH</h1>
      <div class="coming-row">
        <span class="line-sep"></span>
        <span class="coming-text" id="coming-text">COMING SOON</span>
        <span class="line-sep right"></span>
      </div>
      <p class="tagline" id="tagline-text">
        Every gate leads deeper. Calculate the path ahead.
      </p>
    </main>

    <footer class="hud-bottom">
      <div class="hud-bottom-meta">
        MOVE TO LOOK • HOLD [SPACE] TO WALK FASTER
      </div>

      <div class="studio-credit" id="studio-credit">
        By Tetheris App Studios
      </div>

      <div class="mood-bar" id="mood-bar">
        <button class="mood-btn active" data-mood="golden">Golden Hour</button>
        <button class="mood-btn" data-mood="morning">Misty Morning</button>
        <button class="mood-btn" data-mood="night">Rainy Night</button>
      </div>
    </footer>
  </div>

  <script type="module">
    /* =========================================================================
       ✨ 1. TEASER CONFIG — EDIT YOUR TEXT HERE
       ========================================================================= */
    const TEASER_CONFIG = {
      title: "OUTMATH",
      jpKicker: "京都・千本鳥居",
      status: "COMING SOON",
      tagline: "Every gate leads deeper. Calculate the path ahead.",
      locationBadge: "KYOTO // SENBON TORII PATH",
      studioCredit: "By Tetheris App Studios"
    };

    document.title = `${TEASER_CONFIG.title} — ${TEASER_CONFIG.status}`;
    document.getElementById("game-title").textContent = TEASER_CONFIG.title;
    document.getElementById("jp-kicker").textContent = TEASER_CONFIG.jpKicker;
    document.getElementById("coming-text").textContent = TEASER_CONFIG.status;
    document.getElementById("tagline-text").textContent = TEASER_CONFIG.tagline;
    document.getElementById("loc-badge-text").textContent = TEASER_CONFIG.locationBadge;
    document.getElementById("studio-credit").textContent = TEASER_CONFIG.studioCredit;

    /* =========================================================================
       2. SHARED INTERACTION STATE & KYOTO AMBIENT AUDIO ENGINE
       ========================================================================= */
    const state = {
      pointerX: 0,
      pointerY: 0,
      isPaused: false,
      isFastWalk: false,
      mood: "golden"
    };

    class KyotoAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.masterGain = null;
        this.windFilter = null;
        this.chimeTimer = null;
        this.isRain = false;
      }

      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0;
        this.masterGain.connect(this.ctx.destination);

        const bufSize = this.ctx.sampleRate * 3;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          data[i] = (b0 + b1 + b2 + white * 0.02) * 0.35;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = "bandpass";
        this.windFilter.frequency.value = 420;
        this.windFilter.Q.value = 0.9;

        noise.connect(this.windFilter);
        this.windFilter.connect(this.masterGain);
        noise.start();
      }

      playFurinChime() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 587.33, 659.25, 880.0, 1046.5];
        const f = freqs[Math.floor(Math.random() * freqs.length)];
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.045, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 2.9);
      }

      setRainMode(rainOn) {
        this.isRain = rainOn;
        if (this.windFilter && this.ctx) {
          this.windFilter.frequency.setTargetAtTime(rainOn ? 1150 : 420, this.ctx.currentTime, 0.8);
          this.windFilter.Q.setTargetAtTime(rainOn ? 0.45 : 0.9, this.ctx.currentTime, 0.8);
        }
      }

      toggle() {
        this.init();
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.enabled = !this.enabled;
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.35 : 0.0, this.ctx.currentTime, 0.4);
        if (this.enabled) {
          this.setRainMode(this.isRain);
          this.playFurinChime();
          this.chimeTimer = setInterval(() => {
            if (Math.random() > 0.35) this.playFurinChime();
          }, 4200);
        } else {
          clearInterval(this.chimeTimer);
        }
        return this.enabled;
      }
    }

    const ambientAudio = new KyotoAudioEngine();
    const container = document.getElementById("scene-container");

    window.addEventListener("mousemove", (e) => {
      state.pointerX = (e.clientX / window.innerWidth - 0.5) * 2;
      state.pointerY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches[0]) {
        state.pointerX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        state.pointerY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); state.isFastWalk = true; }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space") state.isFastWalk = false;
    });

    container.addEventListener("pointerdown", () => { state.isFastWalk = true; });
    window.addEventListener("pointerup", () => { state.isFastWalk = false; });

    document.getElementById("pause-btn").addEventListener("click", (e) => {
      state.isPaused = !state.isPaused;
      e.target.textContent = state.isPaused ? "Resume Walk" : "Pause Walk";
      e.target.classList.toggle("active", state.isPaused);
    });

    document.getElementById("audio-btn").addEventListener("click", (e) => {
      const on = ambientAudio.toggle();
      e.target.textContent = on ? "Sound: On" : "Sound: Off";
      e.target.classList.toggle("active", on);
    });

    document.getElementById("zen-btn").addEventListener("click", (e) => {
      const zen = document.body.classList.toggle("zen-mode");
      e.target.textContent = zen ? "Show Title" : "Hide Title";
      e.target.classList.toggle("active", zen);
    });

    let onMoodChange = () => {};
    document.querySelectorAll(".mood-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mood = btn.dataset.mood;
        document.querySelectorAll(".mood-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.mood === state.mood);
        });
        ambientAudio.setRainMode(state.mood === "night");
        onMoodChange(state.mood);
      });
    });

    /* =========================================================================
       3. MULTI-CDN THREE.JS LOADER (ZERO SINGLE-POINT-OF-FAILURE)
       ========================================================================= */
    async function loadThreeJS() {
      const cdnList = [
        "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
        "https://unpkg.com/three@0.160.0/build/three.module.js",
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      ];
      for (const url of cdnList) {
        try {
          const mod = await import(url);
          if (mod && mod.WebGLRenderer) return mod;
        } catch (err) {
          console.warn("CDN fallback:", url);
        }
      }
      throw new Error("Three.js CDNs unreachable");
    }

    /* =========================================================================
       4. PHOTOREALISTIC 3D KYOTO TORII CORRIDOR (THREE.JS ENGINE)
       ========================================================================= */
    function startThreeScene(THREE) {
      const isMobile = window.innerWidth < 768;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x432b1f);
      scene.fog = new THREE.FogExp2(0x523424, 0.032);

      const camera = new THREE.PerspectiveCamera(
        58,
        window.innerWidth / window.innerHeight,
        0.1,
        130
      );
      camera.position.set(0, 1.72, 4);

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap || THREE.PCFShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      /* --- Sky Gradient Dome --- */
      const skyUniforms = {
        uTopColor: { value: new THREE.Color(0x3a2b3d) },
        uHorizonColor: { value: new THREE.Color(0xe8995a) }
      };
      const skyMat = new THREE.ShaderMaterial({
        uniforms: skyUniforms,
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uTopColor;
          uniform vec3 uHorizonColor;
          varying vec3 vWorldPos;
          void main() {
            float h = normalize(vWorldPos).y;
            float t = clamp(pow(max(h, 0.0), 0.55), 0.0, 1.0);
            vec3 col = mix(uHorizonColor, uTopColor, t);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      const skyDome = new THREE.Mesh(new THREE.SphereGeometry(95, 24, 16), skyMat);
      scene.add(skyDome);

      /* --- Procedural PBR Textures --- */
      function makeVermilionWoodMaps(withKanji = false) {
        const w = 512, h = 512;
        const cCan = document.createElement("canvas");
        cCan.width = w; cCan.height = h;
        const ctx = cCan.getContext("2d");

        const bCan = document.createElement("canvas");
        bCan.width = w; bCan.height = h;
        const bctx = bCan.getContext("2d");

        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, "#c83817");
        grad.addColorStop(0.5, "#e0481e");
        grad.addColorStop(1, "#c43515");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        bctx.fillStyle = "#808080";
        bctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 600; i++) {
          const x = Math.random() * w;
          const lw = 1 + Math.random() * 2.5;
          const dark = Math.random() > 0.5;
          ctx.fillStyle = dark
            ? `rgba(60, 14, 4, ${0.06 + Math.random() * 0.09})`
            : `rgba(255, 145, 95, ${0.05 + Math.random() * 0.06})`;
          ctx.fillRect(x, 0, lw, h);
          bctx.fillStyle = dark ? "rgba(40,40,40,0.22)" : "rgba(210,210,210,0.18)";
          bctx.fillRect(x, 0, lw, h);
        }

        const weather = ctx.createLinearGradient(0, h * 0.72, 0, h);
        weather.addColorStop(0, "rgba(22, 8, 4, 0)");
        weather.addColorStop(1, "rgba(18, 6, 3, 0.42)");
        ctx.fillStyle = weather;
        ctx.fillRect(0, h * 0.72, w, h * 0.28);

        if (withKanji) {
          ctx.fillStyle = "rgba(18, 12, 10, 0.88)";
          ctx.font = '600 40px "Noto Serif JP", serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const glyphs = ["奉", "納", "京", "都", "算", "術", "覚", "醒"];
          for (let g = 0; g < glyphs.length; g++) {
            ctx.fillText(glyphs[g], w * 0.5, 68 + g * 50);
          }
        }

        const map = new THREE.CanvasTexture(cCan);
        map.colorSpace = THREE.SRGBColorSpace;
        map.wrapS = map.wrapT = THREE.RepeatWrapping;

        const bumpMap = new THREE.CanvasTexture(bCan);
        bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
        return { map, bumpMap };
      }

      function makeFlagstoneMaps() {
        const size = 512;
        const cCan = document.createElement("canvas");
        cCan.width = size; cCan.height = size;
        const ctx = cCan.getContext("2d");

        const rCan = document.createElement("canvas");
        rCan.width = size; rCan.height = size;
        const rctx = rCan.getContext("2d");

        const bCan = document.createElement("canvas");
        bCan.width = size; bCan.height = size;
        const bctx = bCan.getContext("2d");

        ctx.fillStyle = "#262c20";
        ctx.fillRect(0, 0, size, size);
        rctx.fillStyle = "#e6e6e6";
        rctx.fillRect(0, 0, size, size);
        bctx.fillStyle = "#181818";
        bctx.fillRect(0, 0, size, size);

        const rows = 6;
        const rowH = size / rows;
        for (let r = 0; r < rows; r++) {
          const cols = 3 + (r % 2);
          const colW = size / cols;
          const offset = (r % 2) * (colW * 0.45);
          for (let c = -1; c <= cols; c++) {
            const sx = c * colW + offset + 5;
            const sy = r * rowH + 5;
            const sw = colW - 10;
            const sh = rowH - 10;
            const tone = 82 + Math.floor(Math.random() * 32);
            ctx.fillStyle = `rgb(${tone}, ${tone + 1}, ${tone + 2})`;
            ctx.fillRect(sx, sy, sw, sh);

            for (let s = 0; s < 120; s++) {
              const v = Math.random() > 0.5 ? 255 : 0;
              ctx.fillStyle = `rgba(${v},${v},${v},0.06)`;
              ctx.fillRect(sx + Math.random() * sw, sy + Math.random() * sh, 2, 2);
            }

            const damp = Math.random() > 0.45 ? 70 : 168;
            rctx.fillStyle = `rgb(${damp},${damp},${damp})`;
            rctx.fillRect(sx, sy, sw, sh);
            bctx.fillStyle = "rgb(195,195,195)";
            bctx.fillRect(sx, sy, sw, sh);
          }
        }

        const leftMoss = ctx.createLinearGradient(0, 0, size * 0.2, 0);
        leftMoss.addColorStop(0, "rgba(42, 74, 30, 0.85)");
        leftMoss.addColorStop(1, "rgba(42, 74, 30, 0)");
        ctx.fillStyle = leftMoss;
        ctx.fillRect(0, 0, size * 0.2, size);

        const rightMoss = ctx.createLinearGradient(size * 0.8, 0, size, 0);
        rightMoss.addColorStop(0, "rgba(42, 74, 30, 0)");
        rightMoss.addColorStop(1, "rgba(42, 74, 30, 0.85)");
        ctx.fillStyle = rightMoss;
        ctx.fillRect(size * 0.8, 0, size * 0.2, size);

        const map = new THREE.CanvasTexture(cCan);
        map.colorSpace = THREE.SRGBColorSpace;
        map.wrapS = map.wrapT = THREE.RepeatWrapping;
        map.repeat.set(1, 22);

        const roughnessMap = new THREE.CanvasTexture(rCan);
        roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
        roughnessMap.repeat.set(1, 22);

        const bumpMap = new THREE.CanvasTexture(bCan);
        bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
        bumpMap.repeat.set(1, 22);

        return { map, roughnessMap, bumpMap };
      }

      function makeGraniteTexture() {
        const c = document.createElement("canvas");
        c.width = 256; c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#686965";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 2800; i++) {
          const v = 58 + Math.floor(Math.random() * 88);
          ctx.fillStyle = `rgb(${v},${v},${v - 2})`;
          ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
        }
        for (let m = 0; m < 16; m++) {
          ctx.fillStyle = "rgba(56, 84, 38, 0.26)";
          ctx.beginPath();
          ctx.arc(Math.random() * 256, Math.random() * 256, 8 + Math.random() * 16, 0, Math.PI * 2);
          ctx.fill();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function makeBarkTexture() {
        const c = document.createElement("canvas");
        c.width = 256; c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#3c2c21";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 360; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? "rgba(18,12,8,0.45)" : "rgba(95,70,50,0.28)";
          ctx.fillRect(Math.random() * 256, 0, 2 + Math.random() * 4, 256);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function makeSakuraPetalTexture() {
        const c = document.createElement("canvas");
        c.width = 64; c.height = 64;
        const ctx = c.getContext("2d");
        ctx.translate(32, 32);
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
        grad.addColorStop(0, "rgba(255, 245, 248, 0.96)");
        grad.addColorStop(0.65, "rgba(255, 198, 214, 0.9)");
        grad.addColorStop(1, "rgba(244, 154, 178, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.bezierCurveTo(18, -14, 18, 14, 0, 22);
        ctx.bezierCurveTo(-18, 14, -18, -14, 0, -22);
        ctx.fill();
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
