<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#140f0c" />
  <meta name="description" content="OUTMATH — Coming Soon | Live 3D Kyoto Torii Corridor" />
  <title>OUTMATH — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text-primary: #faf6f0;
      --text-muted: rgba(250, 246, 240, 0.72);
      --glass-bg: rgba(16, 13, 12, 0.44);
      --glass-border: rgba(255, 244, 230, 0.18);
      --vermilion: #d9411e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120d0a;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen 3D Viewport */
    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }
    #scene-container:active {
      cursor: grabbing;
    }

    /* Subtle 35mm Cinema Vignette & Atmospheric Depth */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, transparent 38%, rgba(10, 7, 6, 0.68) 100%),
        linear-gradient(180deg, rgba(10, 8, 7, 0.45) 0%, transparent 20%, transparent 78%, rgba(10, 8, 7, 0.72) 100%);
    }

    /* Minimalist Cinema HUD Overlay */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 34px);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-primary);
      transition: opacity 0.4s ease;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--vermilion);
      box-shadow: 0 0 10px rgba(217, 65, 30, 0.9);
    }

    .top-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .pill-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 245, 235, 0.16);
      border-color: rgba(255, 245, 235, 0.42);
    }

    .pill-btn.active {
      background: rgba(250, 246, 240, 0.92);
      color: #140f0c;
      border-color: #faf6f0;
    }

    /* Center Hero Title Lockup */
    .hero-center {
      margin: auto;
      text-align: center;
      max-width: 780px;
      padding: 0 16px;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    body.zen-mode .hero-center,
    body.zen-mode .location-badge,
    body.zen-mode .hud-bottom-meta {
      opacity: 0;
      transform: translateY(-10px);
    }

    .jp-kicker {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(0.85rem, 1.9vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.55em;
      padding-left: 0.55em;
      color: rgba(255, 232, 210, 0.9);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
      margin-bottom: 14px;
    }

    .game-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.1rem, 10.5vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1.02;
      color: #ffffff;
      text-shadow:
        0 8px 36px rgba(0, 0, 0, 0.75),
        0 2px 10px rgba(0, 0, 0, 0.55);
      margin-bottom: 18px;
    }

    .coming-row {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .line-sep {
      width: clamp(28px, 6vw, 72px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 240, 225, 0.72));
    }
    .line-sep.right {
      background: linear-gradient(90deg, rgba(255, 240, 225, 0.72), transparent);
    }

    .coming-text {
      font-size: clamp(0.82rem, 1.8vw, 1.05rem);
      font-weight: 400;
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      text-transform: uppercase;
      color: #fff6ee;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
    }

    .tagline {
      font-size: clamp(0.88rem, 1.7vw, 1.02rem);
      font-weight: 300;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.65;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
    }

    /* Bottom Atmosphere Bar */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hud-bottom-meta {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(250, 246, 240, 0.65);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      transition: opacity 0.4s ease;
    }

    .mood-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .mood-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mood-btn:hover {
      color: #ffffff;
    }

    .mood-btn.active {
      background: #faf6f0;
      color: #140f0c;
    }

    @media (max-width: 700px) {
      .hud-bottom {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hud-top {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="scene-container"></div>
  <div class="cinema-vignette"></div>

  <div class="hud">
    <header class="hud-top">
      <div class="location-badge">
        <span class="badge-dot"></span>
        <span id="loc-badge-text">KYOTO // SENBON TORII PATH</span>
      </div>

      <div class="top-controls">
        <button class="pill-btn" id="pause-btn">Pause Walk</button>
        <button class="pill-btn" id="audio-btn">Sound: Off</button>
        <button class="pill-btn" id="zen-btn">Hide Title</button>
      </div>
    </header>

    <main class="hero-center">
      <div class="jp-kicker" id="jp-kicker">京都・千本鳥居</div>
      <h1 class="game-title" id="game-title">OUTMATH</h1>
      <div class="coming-row">
        <span class="line-sep"></span>
        <span class="coming-text" id="coming-text">COMING SOON</span>
        <span class="line-sep right"></span>
      </div>
      <p class="tagline" id="tagline-text">
        Every gate leads deeper. Calculate the path ahead.
      </p>
    </main>

    <footer class="hud-bottom">
      <div class="hud-bottom-meta" id="hint-meta">
        TETHERIS.APP // MOVE TO LOOK • HOLD [SPACE] TO WALK FASTER
      </div>

      <div class="mood-bar" id="mood-bar">
        <button class="mood-btn active" data-mood="golden">Golden Hour</button>
        <button class="mood-btn" data-mood="morning">Misty Morning</button>
        <button class="mood-btn" data-mood="night">Rainy Night</button>
      </div>
    </footer>
  </div>

  <!-- Three.js r187 via jsDelivr -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    /* =========================================================================
       ✨ 1. TEASER TEXT CONFIG — CUSTOMIZE YOUR GAME DETAILS HERE
       ========================================================================= */
    const TEASER_CONFIG = {
      title: "OUTMATH",
      jpKicker: "京都・千本鳥居",
      status: "COMING SOON",
      tagline: "Every gate leads deeper. Calculate the path ahead.",
      locationBadge: "KYOTO // SENBON TORII PATH"
    };

    document.title = `${TEASER_CONFIG.title} — ${TEASER_CONFIG.status}`;
    document.getElementById("game-title").textContent = TEASER_CONFIG.title;
    document.getElementById("jp-kicker").textContent = TEASER_CONFIG.jpKicker;
    document.getElementById("coming-text").textContent = TEASER_CONFIG.status;
    document.getElementById("tagline-text").textContent = TEASER_CONFIG.tagline;
    document.getElementById("loc-badge-text").textContent = TEASER_CONFIG.locationBadge;

    /* =========================================================================
       2. PROCEDURAL PBR TEXTURE GENERATORS (100% REALISTIC, ZERO DOWNLOADS)
       ========================================================================= */
    function makeVermilionWoodMaps(withKanji = false) {
      const w = 512, h = 512;
      const colorCanvas = document.createElement("canvas");
      colorCanvas.width = w; colorCanvas.height = h;
      const ctx = colorCanvas.getContext("2d");

      const bumpCanvas = document.createElement("canvas");
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bctx = bumpCanvas.getContext("2d");

      // Rich Kyoto vermilion base gradient
      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, "#b83114");
      grad.addColorStop(0.5, "#cf3d1a");
      grad.addColorStop(1, "#b42f13");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      bctx.fillStyle = "#808080";
      bctx.fillRect(0, 0, w, h);

      // Vertical cedar wood grain & subtle lacquer wear
      for (let i = 0; i < 650; i++) {
        const x = Math.random() * w;
        const lw = 1 + Math.random() * 2.5;
        const dark = Math.random() > 0.5;
        ctx.fillStyle = dark
          ? `rgba(55, 12, 4, ${0.06 + Math.random() * 0.1})`
          : `rgba(255, 130, 80, ${0.04 + Math.random() * 0.06})`;
        ctx.fillRect(x, 0, lw, h);

        bctx.fillStyle = dark ? "rgba(40,40,40,0.22)" : "rgba(210,210,210,0.18)";
        bctx.fillRect(x, 0, lw, h);
      }

      // Damp weather darkening near bottom of pillar
      const weatherGrad = ctx.createLinearGradient(0, h * 0.72, 0, h);
      weatherGrad.addColorStop(0, "rgba(22, 8, 4, 0)");
      weatherGrad.addColorStop(1, "rgba(18, 6, 3, 0.45)");
      ctx.fillStyle = weatherGrad;
      ctx.fillRect(0, h * 0.72, w, h * 0.28);

      // Optional traditional black Japanese donor calligraphy (Fushimi Inari style)
      if (withKanji) {
        ctx.save();
        ctx.fillStyle = "rgba(18, 12, 10, 0.88)";
        ctx.font = '600 40px "Noto Serif JP", serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const glyphs = ["奉", "納", "京", "都", "算", "術", "覚", "醒"];
        for (let g = 0; g < glyphs.length; g++) {
          ctx.fillText(glyphs[g], w * 0.5, 68 + g * 50);
          bctx.fillStyle = "rgba(20,20,20,0.55)";
          bctx.font = '600 40px "Noto Serif JP", serif';
          bctx.textAlign = "center";
          bctx.textBaseline = "middle";
          bctx.fillText(glyphs[g], w * 0.5, 68 + g * 50);
        }
        ctx.restore();
      }

      const map = new THREE.CanvasTexture(colorCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;

      return { map, bumpMap };
    }

    function makeFlagstoneMaps() {
      const size = 512;
      const cCan = document.createElement("canvas");
      cCan.width = size; cCan.height = size;
      const ctx = cCan.getContext("2d");

      const rCan = document.createElement("canvas");
      rCan.width = size; rCan.height = size;
      const rctx = rCan.getContext("2d");

      const bCan = document.createElement("canvas");
      bCan.width = size; bCan.height = size;
      const bctx = bCan.getContext("2d");

      // Dark mossy soil mortar background
      ctx.fillStyle = "#22261d";
      ctx.fillRect(0, 0, size, size);
      rctx.fillStyle = "#e6e6e6";
      rctx.fillRect(0, 0, size, size);
      bctx.fillStyle = "#181818";
      bctx.fillRect(0, 0, size, size);

      // Hand-laid granite stone rows (authentic Kyoto shrine steps/pavers)
      const rows = 6;
      const rowH = size / rows;
      for (let r = 0; r < rows; r++) {
        const cols = 3 + (r % 2);
        const colW = size / cols;
        const offset = (r % 2) * (colW * 0.45);

        for (let c = -1; c <= cols; c++) {
          const sx = c * colW + offset + 5;
          const sy = r * rowH + 5;
          const sw = colW - 10;
          const sh = rowH - 10;

          const tone = 68 + Math.floor(Math.random() * 28);
          ctx.fillStyle = `rgb(${tone}, ${tone + 1}, ${tone + 3})`;
          ctx.fillRect(sx, sy, sw, sh);

          // Stone grain speckles
          for (let s = 0; s < 140; s++) {
            const gx = sx + Math.random() * sw;
            const gy = sy + Math.random() * sh;
            const v = Math.random() > 0.5 ? 255 : 0;
            ctx.fillStyle = `rgba(${v},${v},${v},0.06)`;
            ctx.fillRect(gx, gy, 2, 2);
          }

          // Roughness variation: damp reflective patches in the center path
          const damp = Math.random() > 0.45 ? 75 : 175;
          rctx.fillStyle = `rgb(${damp},${damp},${damp})`;
          rctx.fillRect(sx, sy, sw, sh);

          // Raised stone height for bump map
          bctx.fillStyle = `rgb(${175 + Math.floor(Math.random() * 45)},185,185)`;
          bctx.fillRect(sx, sy, sw, sh);
        }
      }

      // Mossy green damp edges along both sides of the flagstone walkway
      const leftMoss = ctx.createLinearGradient(0, 0, size * 0.22, 0);
      leftMoss.addColorStop(0, "rgba(38, 66, 28, 0.85)");
      leftMoss.addColorStop(1, "rgba(38, 66, 28, 0)");
      ctx.fillStyle = leftMoss;
      ctx.fillRect(0, 0, size * 0.22, size);

      const rightMoss = ctx.createLinearGradient(size * 0.78, 0, size, 0);
      rightMoss.addColorStop(0, "rgba(38, 66, 28, 0)");
      rightMoss.addColorStop(1, "rgba(38, 66, 28, 0.85)");
      ctx.fillStyle = rightMoss;
      ctx.fillRect(size * 0.78, 0, size * 0.22, size);

      const map = new THREE.CanvasTexture(cCan);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(1, 22);

      const roughnessMap = new THREE.CanvasTexture(rCan);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(1, 22);

      const bumpMap = new THREE.CanvasTexture(bCan);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(1, 22);

      return { map, roughnessMap, bumpMap };
    }

    function makeGraniteTexture() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#5c5d5a";
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 3200; i++) {
        const v = 50 + Math.floor(Math.random() * 85);
        ctx.fillStyle = `rgb(${v},${v},${v - 2})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      // Lichen / moss patches
      for (let m = 0; m < 18; m++) {
        ctx.fillStyle = "rgba(52, 76, 36, 0.25)";
        ctx.beginPath();
        ctx.arc(Math.random() * 256, Math.random() * 256, 8 + Math.random() * 18, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makeBarkTexture() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#33251c";
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 400; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? "rgba(18,12,8,0.45)" : "rgba(85,62,46,0.28)";
        ctx.fillRect(Math.random() * 256, 0, 2 + Math.random() * 4, 256);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makeSakuraPetalTexture() {
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const ctx = c.getContext("2d");
      ctx.translate(32, 32);
      const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
      grad.addColorStop(0, "rgba(255, 242, 246, 0.96)");
      grad.addColorStop(0.65, "rgba(255, 198, 214, 0.88)");
      grad.addColorStop(1, "rgba(244, 154, 178, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.bezierCurveTo(18, -14, 18, 14, 0, 22);
      ctx.bezierCurveTo(-18, 14, -18, -14, 0, -22);
      ctx.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    /* =========================================================================
       3. SCENE, CAMERA, RENDERER & REAL-TIME SHADOW SETUP
       ========================================================================= */
    const container = document.getElementById("scene-container");
    const isMobile = window.innerWidth < 768;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2d2019);
    scene.fog = new THREE.FogExp2(0x3a281e, 0.036);

    const camera = new THREE.PerspectiveCamera(
      58,
      window.innerWidth / window.innerHeight,
      0.1,
      110
    );
    camera.position.set(0, 1.72, 4);

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobile,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    /* =========================================================================
       4. LIGHTING RIG (SUNLIGHT STRIPES + SKY HEMISPHERE + FLICKERING LANTERNS)
       ========================================================================= */
    const hemiLight = new THREE.HemisphereLight(0xffdfc2, 0x222c1d, 0.72);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffb470, 3.6);
    sunLight.position.set(16, 18, -6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 65;
    sunLight.shadow.camera.left = -22;
    sunLight.shadow.camera.right = 22;
    sunLight.shadow.camera.top = 24;
    sunLight.shadow.camera.bottom = -24;
    sunLight.shadow.bias = -0.0006;
    scene.add(sunLight);
    scene.add(sunLight.target);
    sunLight.target.position.set(0, 0, -14);

    // Subtle warm bounce light filling the vermilion tunnel interior
    const corridorBounce = new THREE.PointLight(0xff7740, 2.2, 22, 1.6);
    corridorBounce.position.set(0, 2.4, -3);
    scene.add(corridorBounce);

    // 4 Leapfrogging Warm Lantern Point Lights (active strongly in Rainy Night mode)
    const lanternPoolLights = [];
    for (let i = 0; i < 4; i++) {
      const pl = new THREE.PointLight(0xffaa55, 0.8, 12, 1.8);
      pl.position.set(i % 2 === 0 ? -2.35 : 2.35, 1.75, -i * 8 - 3);
      scene.add(pl);
      lanternPoolLights.push(pl);
    }

    /* =========================================================================
       5. SHARED PBR MATERIALS
       ========================================================================= */
    const woodPlain = makeVermilionWoodMaps(false);
    const woodKanji = makeVermilionWoodMaps(true);
    const stoneFloor = makeFlagstoneMaps();
    const graniteTex = makeGraniteTexture();
    const barkTex = makeBarkTexture();

    const vermilionMat = new THREE.MeshStandardMaterial({
      map: woodPlain.map,
      bumpMap: woodPlain.bumpMap,
      bumpScale: 0.015,
      roughness: 0.42,
      metalness: 0.04
    });

    const vermilionKanjiMat = new THREE.MeshStandardMaterial({
      map: woodKanji.map,
      bumpMap: woodKanji.bumpMap,
      bumpScale: 0.018,
      roughness: 0.44,
      metalness: 0.04
    });

    const blackLacquerMat = new THREE.MeshStandardMaterial({
      color: 0x161414,
      roughness: 0.36,
      metalness: 0.08
    });

    const goldTrimMat = new THREE.MeshStandardMaterial({
      color: 0xc99c3c,
      roughness: 0.35,
      metalness: 0.72
    });

    const graniteMat = new THREE.MeshStandardMaterial({
      map: graniteTex,

    function createToriiGate(index) {
      const gate = new THREE.Group();
      const halfW = 1.68;
      const pMat = index % 2 === 0 ? vermilionKanjiMat : vermilionMat;

      for (const side of [-1, 1]) {
        const x = side * halfW;

        // Hexagonal granite stone foundation (Kamebara)
        const ped = new THREE.Mesh(sharedToriiGeos.pedestal, graniteMat);
        ped.position.set(x, 0.14, 0);
        ped.castShadow = true;

        const pillar = new THREE.Mesh(sharedToriiGeos.pillar, pMat);
        pillar.position.set(x - side * 0.05, 2.38, 0);
        pillar.rotation.z = side * 0.025;
        pillar.rotation.y = side > 0 ? Math.PI : 0;
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        gate.add(pillar);

        // Wedge collar (Kusabi) where Nuki crosses pillar
        const kusabi = new THREE.Mesh(sharedToriiGeos.kusabi, blackLacquerMat);
        kusabi.position.set(x - side * 0.07, 3.45, 0);
        gate.add(kusabi);

      nuki.castShadow = true;

      shimaki.castShadow = true;

      // Curved black roof beam (Kasagi) with upturned wing ends
      const kasagi = new THREE.Mesh(sharedToriiGeos.kasagiCenter, blackLacquerMat);
      kasagi.position.set(0, 4.24, 0);
      kasagi.castShadow = true;
      gate.add(kasagi);

      const leftTip = new THREE.Mesh(sharedToriiGeos.kasagiTip, blackLacquerMat);
      leftTip.position.set(-2.55, 4.35, 0);

      const plaque = new THREE.Mesh(sharedToriiGeos.plaque, blackLacquerMat);
      plaque.position.set(0, 3.76, 0.01);
      gate.add(border, plaque);

      return gate;
    }
